<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gaya Garis Konten (Stroke bergaya coretan/hand-drawn) -->
  <g fill="none" stroke="#1b3d2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Lingkaran Utama di Tengah (Lollipop / Kaca Pembesar) -->
    <path d="M 50,30 C 62,30 68,46 58,56 C 48,66 32,58 36,44 C 38,34 44,30 50,30 Z" />
    
    <!-- Garis Gagang di Bawah Lingkaran -->
    <path d="M 48,62 L 46,74" />
    
    <!-- Elemen Bentuk Daun/Hati di Kanan Atas -->
    <path d="M 64,26 C 62,18 72,12 76,20 C 80,28 72,34 66,32" />
    
    <!-- Elemen Cabang/Garis Garpu di Kiri Bawah -->
    <path d="M 28,58 C 26,64 22,68 22,72 M 25,65 L 18,65" />
    
    <!-- Elemen Bintang/Coretan Silang di Kanan Bawah -->
    <path d="M 66,66 L 76,74 M 76,64 L 68,76 M 62,70 L 72,70" />
    
    <!-- Aksen Titik-Titik di Sekitar (Menggunakan lingkaran kecil dengan fill) -->
    <circle cx="21" cy="45" r="2" fill="#1b3d2b" stroke="none" />
    <circle cx="81" cy="43" r="2" fill="#1b3d2b" stroke="none" />
    <circle cx="50" cy="24" r="1.5" fill="#1b3d2b" stroke="none" />
  </g>
</svg>
